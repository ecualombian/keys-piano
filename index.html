<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Keys &middot; learn piano</title>
<style>
  :root{
    --stage:#17141a;
    --stage-2:#1e1a22;
    --panel:#252029;
    --panel-line:#332c39;
    --ivory:#f4efe4;
    --ivory-dim:#d9d2c4;
    --ebony:#26222c;
    --ink:#ece6da;
    --ink-mute:#98918a;
    --brass:#e0a458;
    --brass-bright:#f4c07e;
    --good:#63cf92;
    --bad:#e56f63;
    --lane:#3a5c66;
    --lane-bright:#6fb6c9;
    --shadow:0 18px 44px rgba(0,0,0,.5);
    --r:14px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:
      radial-gradient(120% 90% at 50% -10%, #221d28 0%, var(--stage) 55%, #120f15 100%);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    -webkit-text-size-adjust:100%;
    overflow:hidden;
    user-select:none;
    -webkit-user-select:none;
    touch-action:manipulation;
  }
  .app{
    height:100dvh;
    display:flex;
    flex-direction:column;
    max-width:1240px;
    margin:0 auto;
    padding:14px 16px 10px;
    gap:12px;
  }

  /* ---- top bar ---- */
  header{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .wordmark{display:flex;align-items:baseline;gap:10px;margin-right:auto}
  .wordmark b{
    font-family:Georgia,"Iowan Old Style","Times New Roman",serif;
    font-weight:600;font-size:26px;letter-spacing:.5px;color:var(--ink);
  }
  .wordmark span{
    font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--ink-mute);
  }
  .controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  select,button.ctl{
    font:inherit;font-size:13px;color:var(--ink);
    background:var(--panel);border:1px solid var(--panel-line);
    border-radius:10px;padding:8px 12px;cursor:pointer;
    transition:border-color .15s, background .15s;
  }
  select:hover,button.ctl:hover{border-color:var(--brass)}
  select{padding-right:26px}
  .seg{display:flex;background:var(--panel);border:1px solid var(--panel-line);border-radius:10px;padding:3px}
  .seg button{
    font:inherit;font-size:13px;color:var(--ink-mute);background:transparent;border:0;
    padding:6px 13px;border-radius:8px;cursor:pointer;transition:all .15s;
  }
  .seg button[aria-pressed="true"]{background:var(--brass);color:#241703;font-weight:600}
  .toggle{
    display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-mute);
    background:var(--panel);border:1px solid var(--panel-line);border-radius:10px;padding:7px 11px;cursor:pointer;
  }
  .toggle input{accent-color:var(--brass);width:15px;height:15px}
  .toggle.on{color:var(--ink)}

  /* ---- status strip ---- */
  .status{
    display:flex;align-items:center;gap:22px;
    padding:0 4px;font-size:13px;color:var(--ink-mute);min-height:20px;
  }
  .status .k{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:600}
  .status .msg{margin-left:auto;color:var(--brass-bright);font-weight:500;transition:opacity .2s}
  .status .msg.hidden{opacity:0}
  .micmeter{display:flex;align-items:center;gap:7px}
  .micmeter .bar{width:72px;height:9px;background:var(--panel);border:1px solid var(--panel-line);border-radius:5px;overflow:hidden}
  .micmeter .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--good),var(--brass-bright));transition:width .08s}
  .micmeter .hz{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;min-width:30px}
  .micmeter input[type=range]{width:76px;accent-color:var(--brass);cursor:pointer}

  /* ---- falling lane ---- */
  .lane-wrap{
    position:relative;flex:1;min-height:120px;
    background:linear-gradient(180deg, var(--stage-2), #14111a);
    border:1px solid var(--panel-line);border-radius:var(--r);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.03), var(--shadow);
    overflow:hidden;
  }
  canvas#lane{display:block;width:100%;height:100%}
  .lane-hint{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:var(--ink-mute);font-size:15px;text-align:center;padding:20px;pointer-events:none;
  }

  /* ---- keyboard ---- */
  .kb-wrap{position:relative;flex-shrink:0}
  .keyboard{
    position:relative;display:flex;height:190px;
    border-radius:0 0 12px 12px;
    filter:drop-shadow(0 12px 20px rgba(0,0,0,.45));
  }
  .wk{
    position:relative;flex:1;background:linear-gradient(180deg,#fffdf7,var(--ivory) 60%,var(--ivory-dim));
    border:1px solid #b9b1a0;border-top:3px solid #cfc7b5;
    border-radius:0 0 7px 7px;margin:0 1px;cursor:pointer;
    display:flex;align-items:flex-end;justify-content:center;padding-bottom:9px;
  }
  .wk .lbl{font-size:11px;color:#8a8271;font-weight:600;opacity:0;transition:opacity .15s}
  .show-labels .wk .lbl{opacity:1}
  .bk{
    position:absolute;top:0;width:60%;height:62%;z-index:3;
    background:linear-gradient(180deg,#3a343f,var(--ebony) 70%,#0f0d12);
    border:1px solid #0a080d;border-radius:0 0 5px 5px;cursor:pointer;
    box-shadow:0 4px 6px rgba(0,0,0,.5);
    display:flex;align-items:flex-end;justify-content:center;padding-bottom:7px;
  }
  .bk .lbl{font-size:9px;color:#b7ac9a;font-weight:600;opacity:0;transition:opacity .15s}
  .show-labels .bk .lbl{opacity:.85}
  .wk.down{background:linear-gradient(180deg,#f0e8d4,#ddd3bd);border-top-color:#b7ad97}
  .bk.down{background:linear-gradient(180deg,#26222c,#0c0a10)}
  .wk.target{background:linear-gradient(180deg,#fce3bb,#f4c07e);border-color:#d59a4f}
  .bk.target{background:linear-gradient(180deg,#c98c3f,#8a5c1e)}
  .wk.target .lbl,.bk.target .lbl{opacity:1;color:#5a3d0e}
  .wk.targetL{background:linear-gradient(180deg,#ddcdf2,#b89ae2);border-color:#9678c2}
  .bk.targetL{background:linear-gradient(180deg,#8d6cc0,#5d4487)}
  .wk.targetL .lbl,.bk.targetL .lbl{opacity:1;color:#2e1d4d}
  .wk.good,.bk.good{background:linear-gradient(180deg,#8fe4b0,#4bbd7c)!important}
  .wk.middlec::after{
    content:"";position:absolute;bottom:30px;left:50%;transform:translateX(-50%);
    width:7px;height:7px;border-radius:50%;background:var(--brass);opacity:.75;
  }
  .wk.bad,.bk.bad{animation:shake .3s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}

  @media (max-width:560px){
    .wordmark span{display:none}
    .keyboard{height:150px}
    .wk .lbl{font-size:9px}
  }
  @media (prefers-reduced-motion:reduce){
    .wk.bad,.bk.bad{animation:none}
  }
  a.footnote{position:absolute;bottom:6px;right:12px;font-size:11px;color:var(--ink-mute);opacity:.6}

  /* ---- Spotify play-along panel ---- */
  .spot-panel{
    position:absolute;inset:0;z-index:5;
    background:linear-gradient(180deg, var(--stage-2), #14111a);
    border-radius:var(--r);
    display:flex;flex-direction:column;gap:14px;
    padding:18px 20px;overflow-y:auto;-webkit-overflow-scrolling:touch;
  }
  .spot-panel[hidden]{display:none}
  .spot-head{display:flex;align-items:center;gap:10px}
  .spot-head h2{
    margin:0;font-family:Georgia,"Iowan Old Style",serif;font-weight:600;
    font-size:19px;letter-spacing:.3px;
  }
  .spot-head .close{margin-left:auto}
  .spot-note{font-size:13px;color:var(--ink-mute);line-height:1.5;max-width:60ch}
  .spot-note b{color:var(--ink)}
  .spot-note ol{margin:8px 0 0;padding-left:20px}
  .spot-note li{margin:4px 0}
  .spot-note a{color:var(--brass-bright)}
  .spot-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .spot-row input[type=text]{
    flex:1;min-width:200px;font:inherit;font-size:13px;color:var(--ink);
    background:var(--panel);border:1px solid var(--panel-line);border-radius:10px;
    padding:9px 12px;user-select:text;-webkit-user-select:text;
  }
  .spot-row input[type=text]:focus{outline:none;border-color:var(--brass)}
  .spot-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;
  }
  .spot-card{
    text-align:left;font:inherit;font-size:13px;color:var(--ink);cursor:pointer;
    background:var(--panel);border:1px solid var(--panel-line);border-radius:12px;
    padding:12px 13px;transition:border-color .15s;
    display:flex;flex-direction:column;gap:4px;
  }
  .spot-card:hover{border-color:var(--brass)}
  .spot-card .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .spot-card .c{font-size:12px;color:var(--ink-mute)}
  .spot-embed{border:0;border-radius:12px;width:100%;height:352px;flex-shrink:0}
  .spot-err{color:var(--bad);font-size:13px}
</style>

<div class="app">
  <header>
    <div class="wordmark"><b>Keys</b><span>practice room</span></div>
    <div class="controls">
      <div class="seg" role="group" aria-label="Mode">
        <button id="mode-learn" aria-pressed="true">Learn a song</button>
        <button id="mode-free" aria-pressed="false">Free play</button>
      </div>
      <div class="seg" role="group" aria-label="Hands" id="handSeg" hidden>
        <button id="hand-L" aria-pressed="false">Left</button>
        <button id="hand-B" aria-pressed="true">Both</button>
        <button id="hand-R" aria-pressed="false">Right</button>
      </div>
      <select id="song" aria-label="Choose a song"></select>
      <button class="ctl" id="listen">&#9654; Listen</button>
      <button class="ctl" id="restart">&#8635; Restart</button>
      <label class="toggle on" id="labelsWrap"><input type="checkbox" id="labels" checked>Note names</label>
      <label class="toggle" id="micWrap"><input type="checkbox" id="mic">Use my real piano &#127908;</label>
      <button class="ctl" id="spotifyBtn">&#9835; Play along</button>
    </div>
  </header>

  <div class="status">
    <div>Next: <span class="k" id="nextNote">&mdash;</span></div>
    <div>Progress: <span class="k" id="progress">0 / 0</span></div>
    <div>Accuracy: <span class="k" id="accuracy">100%</span></div>
    <div id="midiStatus" hidden>&#127929; <span class="k" id="midiDevName"></span></div>
    <div class="micmeter" id="micMeterWrap" hidden>&#127908; <div class="bar"><i id="micBar"></i></div> <span class="hz" id="micHeard">&mdash;</span>
      <input type="range" id="micGainCtl" min="1" max="12" step="0.5" title="Mic sensitivity"></div>
    <div class="msg hidden" id="msg"></div>
  </div>

  <div class="lane-wrap">
    <canvas id="lane"></canvas>
    <div class="lane-hint" id="hint">Pick a song and start tapping the glowing key &mdash; it waits for you before moving on.</div>
    <div class="spot-panel" id="spotPanel" hidden>
      <div class="spot-head">
        <h2>Play along with your music</h2>
        <button class="ctl close" id="spotClose">&#10005; Close</button>
      </div>
      <div id="spotBody"></div>
    </div>
  </div>

  <div class="kb-wrap">
    <div class="keyboard show-labels" id="keyboard"></div>
  </div>
</div>

<script>
(() => {
  "use strict";

  // ---------- music helpers ----------
  const NAMES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
  const NAMES_FLAT = ["C","Db","D","Eb","E","F","Gb","G","Ab","A","Bb","B"];
  const BLACK = new Set([1,3,6,8,10]);
  let useFlats = false;   // flat-key songs (see song.flats) spell Bb, not A#, to match the sheet
  const midiName = m => (useFlats?NAMES_FLAT:NAMES)[m%12] + (Math.floor(m/12)-1);
  const midiFreq = m => 440 * Math.pow(2, (m-69)/12);

  // ---------- songs (right-hand melodies, public domain) ----------
  // n = MIDI note, b = beats
  const SONGS = {
    twinkle: { name:"Twinkle, Twinkle", tempo:104, notes:[
      [60,1],[60,1],[67,1],[67,1],[69,1],[69,1],[67,2],
      [65,1],[65,1],[64,1],[64,1],[62,1],[62,1],[60,2],
      [67,1],[67,1],[65,1],[65,1],[64,1],[64,1],[62,2],
      [67,1],[67,1],[65,1],[65,1],[64,1],[64,1],[62,2],
      [60,1],[60,1],[67,1],[67,1],[69,1],[69,1],[67,2],
      [65,1],[65,1],[64,1],[64,1],[62,1],[62,1],[60,2]
    ]},
    ode: { name:"Ode to Joy", tempo:112, notes:[
      [64,1],[64,1],[65,1],[67,1],[67,1],[65,1],[64,1],[62,1],
      [60,1],[60,1],[62,1],[64,1],[64,1.5],[62,.5],[62,2],
      [64,1],[64,1],[65,1],[67,1],[67,1],[65,1],[64,1],[62,1],
      [60,1],[60,1],[62,1],[64,1],[62,1.5],[60,.5],[60,2]
    ]},
    mary: { name:"Mary Had a Little Lamb", tempo:100, notes:[
      [64,1],[62,1],[60,1],[62,1],[64,1],[64,1],[64,2],
      [62,1],[62,1],[62,2],[64,1],[67,1],[67,2],
      [64,1],[62,1],[60,1],[62,1],[64,1],[64,1],[64,1],[64,1],
      [62,1],[62,1],[64,1],[62,1],[60,4]
    ]},
    furelise: { name:"Für Elise (opening)", tempo:120, notes:[
      [76,.5],[75,.5],[76,.5],[75,.5],[76,.5],[71,.5],[74,.5],[72,.5],
      [69,1],[60,.5],[64,.5],[69,.5],[71,1],[64,.5],[68,.5],[71,.5],[72,1],
      [64,.5],[76,.5],[75,.5],[76,.5],[75,.5],[76,.5],[71,.5],[74,.5],[72,.5],
      [69,1],[60,.5],[64,.5],[69,.5],[71,1],[64,.5],[72,.5],[71,.5],[69,2]
    ]},
    scale: { name:"C Major scale (warm-up)", tempo:96, notes:[
      [60,1],[62,1],[64,1],[65,1],[67,1],[69,1],[71,1],[72,2],
      [72,1],[71,1],[69,1],[67,1],[65,1],[64,1],[62,1],[60,2]
    ]},
    // Petzold, Minuet in G minor BWV Anh. 115 (Anna Magdalena Bach Notebook).
    // Right hand, complete, both halves; notes verified against the Mutopia
    // Project engraving (public domain), matching the user's printed edition.
    minuetgm: { name:"Minuet in G minor (Bach notebook)", tempo:100, flats:true, notes:[
      [82,1],[81,1],[79,1],
      [81,1],[74,1],[74,1],
      [79,1],[67,.5],[69,.5],[70,.5],[72,.5],
      [74,3],
      [75,1],[77,.5],[75,.5],[74,.5],[72,.5],
      [74,1],[75,.5],[74,.5],[72,.5],[70,.5],
      [72,1],[74,.5],[72,.5],[70,.5],[72,.5],
      [69,3,1],
      [82,1],[81,1,1],[79,1],
      [81,1],[74,1],[74,1],
      [79,1],[67,.5],[69,.5],[70,.5],[72,.5],
      [74,3],
      [77,1,-2],[79,.5],[77,.5],[75,.5],[74,.5],
      [75,1],[77,.5],[75,.5],[74,.5],[72,.5],
      [74,1],[79,1],[72,1,2],
      [70,3],
      [74,1],[70,.5],[72,.5],[74,.5],[76,.5],
      [77,1],[79,1],[81,1],
      [82,1],[79,.5],[81,.5],[82,.5],[79,.5],
      [81,1],[79,.5],[81,.5],[77,1],
      [65,.5],[67,.5],[69,.5],[70,.5],[72,.5],[74,.5],
      [75,1],[74,1,-2],[72,1],
      [77,1],[70,1],[69,1],
      [70,3],
      [67,1],[74,.5],[72,.5],[74,1],
      [67,1],[75,.5],[74,.5],[75,1],
      [67,.5],[74,.5],[66,.5],[72,.5],[67,.5],[70,.5],
      [69,3],
      [62,.5],[64,.5],[66,.5],[67,.5],[69,.5],[70,.5],
      [72,1],[70,1],[69,1],
      [70,.5,2],[72,.25],[74,.25],[67,1],[66,1],
      [67,3]
    ],
    // left hand (bass), same source; [null,b] = rest, [m,0] = chord with next note
    lh: [
      [55,3],
      [53,3],
      [51,3],
      [50,1],[62,.5],[60,.5],[58,.5],[57,.5],
      [55,0],[58,2],[57,1],
      [58,2],[55,1],
      [57,1],[54,1],[55,1],
      [50,1],[62,.5],[60,.5],[58,.5],[57,.5],
      [55,3],
      [53,3],
      [51,3],
      [50,1],[62,.5],[60,.5],[59,.5],[57,.5],
      [62,0],[59,2],[55,1],
      [60,1],[57,1],[53,1],
      [58,1],[51,1],[53,0],[57,1],
      [58,1],[46,2],
      [58,3],
      [57,1],[55,1],[53,1],
      [55,1],[52,1],[48,1],
      [53,2],[null,1],
      [57,1],[55,1],[53,1],
      [55,1],[53,1],[51,1],
      [50,1],[51,1],[53,1],
      [46,1],[62,1],[60,1],
      [62,0],[59,3],
      [60,3],
      [58,1],[57,1],[55,1],
      [62,1],[57,.5],[55,.5],[54,.5],[52,.5],
      [50,2],[null,1],
      [51,1],[50,1],[48,1],
      [46,1],[48,1],[50,1],
      [55,1],[43,2]
    ]},
    // Musette "Oh ma tendre musette" (anon., public domain) — from the user's
    // method book, 6/8 in F. Part 1 (A section, repeated) transcribed from photo;
    // B section pending a second reading pass.
    musette: { name:"Musette — part 1 (Oh ma tendre)", tempo:96, flats:true, notes:[
      [72,.5],[72,.5],[72,.5],[76,1],[74,.5],
      [79,1],[77,.5],[76,1.5],
      [77,.5],[79,.5],[77,.5],[76,1],[74,.5],
      [76,3],
      [72,.5],[72,.5],[72,.5],[76,1],[74,.5],
      [79,1],[77,.5],[76,1.5],
      [77,.5],[79,.5],[77,.5],[76,1],[74,.5],
      [76,3]
    ],
    lh: [
      [53,.5],[57,.5],[60,.5],[53,.5],[57,.5],[60,.5],
      [53,.5],[57,.5],[60,.5],[53,.5],[57,.5],[60,.5],
      [52,.5],[55,.5],[60,.5],[52,.5],[55,.5],[60,.5],
      [52,.5],[55,.5],[60,.5],[48,1],[null,.5],
      [53,.5],[57,.5],[60,.5],[53,.5],[57,.5],[60,.5],
      [53,.5],[57,.5],[60,.5],[53,.5],[57,.5],[60,.5],
      [52,.5],[55,.5],[60,.5],[52,.5],[55,.5],[60,.5],
      [52,.5],[55,.5],[60,.5],[48,1],[null,.5]
    ]},
    // Pachelbel, Canon in D — public domain; violin line per the Mutopia/Paterson
    // engraving (CC-BY), ground bass per Pachelbel's ostinato. Sections: quarter
    // theme (2 cycles), repeated-note quarters, the eighth-note runs, final D.
    canon: { name:"Canon in D (Pachelbel)", tempo:76, notes:[
      [78,1],[76,1],[74,1],[73,1],
      [71,1],[69,1],[71,1],[73,1],
      [74,1],[73,1],[71,1],[69,1],
      [67,1],[66,1],[67,1],[64,1],
      [74,1],[78,1],[81,1],[79,1],
      [78,1],[74,1],[78,1],[76,1],
      [74,1],[71,1],[74,1],[69,1],
      [67,1],[71,1],[69,1],[67,1],
      [76,1],[76,1],[74,1],[74,1],
      [73,1],[73,1],[71,1],[71,1],
      [69,1],[69,1],[67,1],[67,1],
      [69,1],[69,1],[71,1],[71,1],
      [74,.5],[73,.5],[74,.5],[62,.5],[61,.5],[69,.5],[64,.5],[66,.5],
      [62,.5],[74,.5],[73,.5],[71,.5],[73,.5],[66,.5],[69,.5],[71,.5],
      [67,.5],[66,.5],[64,.5],[67,.5],[66,.5],[64,.5],[62,.5],[73,.5],
      [71,.5],[69,.5],[67,.5],[66,.5],[64,.5],[67,.5],[66,.5],[64,.5],
      [74,4]
    ],
    // ground bass: D A B F# G D G A as half notes, one cycle per 4 bars
    lh: [
      [50,2],[45,2],[47,2],[42,2],[43,2],[50,2],[43,2],[45,2],
      [50,2],[45,2],[47,2],[42,2],[43,2],[50,2],[43,2],[45,2],
      [50,2],[45,2],[47,2],[42,2],[43,2],[50,2],[43,2],[45,2],
      [50,2],[45,2],[47,2],[42,2],[43,2],[50,2],[43,2],[45,2],
      [50,4]
    ]}
  };

  // Honor the Minuet's repeat signs (||: :||): each 16-bar half (48 beats) plays twice.
  (() => {
    const s = SONGS.minuetgm;
    const splitAt = (arr, beats) => {
      let t = 0, i = 0;
      for(; i < arr.length && t < beats; i++) t += arr[i][1];
      return [arr.slice(0, i), arr.slice(i)];
    };
    for(const part of ["notes", "lh"]){
      const [A, B] = splitAt(s[part], 48);
      s[part] = [...A, ...A, ...B, ...B];
    }
  })();

  // ---------- audio ----------
  let AC = null;
  function ac(){ if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)(); return AC; }
  function playNote(m, dur=0.6, vel=0.5){
    const c = ac(); const t = c.currentTime;
    const g = c.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vel, t+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    g.connect(c.destination);
    [0, 12].forEach((semi,i) => {                 // fundamental + soft octave
      const o = c.createOscillator();
      o.type = i ? "sine" : "triangle";
      o.frequency.value = midiFreq(m+semi);
      const og = c.createGain(); og.gain.value = i ? 0.25 : 1;
      o.connect(og); og.connect(g);
      o.start(t); o.stop(t+dur+0.05);
    });
  }

  // ---------- build keyboard (dynamic range, always C-to-C) ----------
  const kb = document.getElementById("keyboard");
  let keyEls = {}; // midi -> element

  function buildKeyboard(lo, hi){
    kb.replaceChildren(); keyEls = {};
    const blacks = [];
    for(let m=lo;m<=hi;m++){
      if(BLACK.has(m%12)){ blacks.push(m); continue; }
      const el = document.createElement("div");
      el.className = "wk"; el.dataset.m = m;
      if(m===60) el.classList.add("middlec");   // middle C gets the anchor dot
      el.innerHTML = '<span class="lbl">'+midiName(m)+'</span>';
      kb.appendChild(el); keyEls[m] = el;
    }
    blacks.forEach(m => {
      const el = document.createElement("div");
      el.className = "bk"; el.dataset.m = m;
      el.innerHTML = '<span class="lbl">'+midiName(m)+'</span>';
      kb.appendChild(el); keyEls[m] = el;
    });
    layoutBlackKeys();
  }

  // Black keys sit on top of the whites at measured pixel positions, so they must be
  // re-measured EVERY time the keyboard's size changes (rotation, toolbar, resize) —
  // placing them only once at load let them drift out of alignment with the whites.
  function layoutBlackKeys(){
    for(const key in keyEls){
      const m = +key;
      if(!BLACK.has(m%12)) continue;
      const lw = keyEls[m-1]; if(!lw) continue;
      const w = lw.offsetWidth;
      keyEls[m].style.left = (lw.offsetLeft + w*0.68) + "px";
      keyEls[m].style.width = (w*0.62) + "px";

  // ResizeObserver + resize events (instant), and a timer as the safety net

  // Pick a C-to-C window sized to the song (both hands included), centered on it,
  // so middle C lands near the middle of the screen instead of the far edge.
  function windowForSong(s){
    const ns = s.notes.map(n=>n[0]).concat((s.lh||[]).map(n=>n[0])).filter(m=>m!=null);
    const min = Math.min(...ns), max = Math.max(...ns);
    const size = Math.max(24, 12*Math.ceil((max-min+2)/12));
    let lo = 12*Math.round(((min+max)/2 - size/2)/12);
    while(lo+size < max) lo += 12;
    while(lo > min) lo -= 12;
    return [lo, lo+size];
  }

  // ---------- state ----------
  let mode = "learn";
  let song = SONGS.ode;
  let handFilter = "B";    // L = left hand only, R = right only, B = both
  let steps = [];          // timeline: [{t, notes:[{m, hand, b, done}]}] sorted by t
  let idx = 0;             // current step index
  let curT = 0;            // animated playhead position, in beats
  let hits = 0, misses = 0;

  // Merge right hand (song.notes) and left hand (song.lh) into one timeline.
  // Entries are [midi, beats]; midi null = rest; a [m,0] entry starts a chord
  // with the following note (zero beats advance no time).
  function buildSteps(s){
    const ev = [];
    const walk = (arr, hand) => {
      let t = 0;
      for(const [m,b,o] of (arr||[])){ if(m!=null) ev.push({t, m, hand, b, o}); t += b; }
    };
    // the hand selector filters at the source: Left = lh only, Right = melody only
    if(handFilter !== "L") walk(s.notes, 0);
    if(handFilter !== "R") walk(s.lh, 1);
    const byT = new Map();
    for(const e of ev){
      const k = Math.round(e.t*96);
      if(!byT.has(k)) byT.set(k, {t:e.t, notes:[]});
      byT.get(k).notes.push({m:e.m, hand:e.hand, b:e.b, o:e.o, done:false});
    }
    const list = [...byT.values()].sort((a,b)=>a.t-b.t);
    for(const st of list){                       // chord members written [m,0] sound
      const dur = Math.max(...st.notes.map(n=>n.b));   // for as long as the chord lasts
      for(const n of st.notes) if(!n.b) n.b = dur;
    }
    return list;
  }

    if(cand){

      // performing the mordent/trill (main-neighbor-main, even over a held chord)

      const nearOrn = st => st && st.notes.some(n => n.o && Math.abs(n.m - m) <= 2);
      if(nearOrn(step) || (performance.now() - lastDoneAt < 700 && nearOrn(lastDoneStep))) return;

  function resize(){

  function keyX(m){
    // center x of a key relative to keyboard, mapped into lane width
    const k = keyEls[m]; if(!k) return null;
    const kbRect = kb.getBoundingClientRect();
    const kRect = k.getBoundingClientRect();
    const cx = (kRect.left - kbRect.left + kRect.width/2) / kbRect.width;
    return { x: cx*W, w: (kRect.width/kbRect.width)*W };

    if(kb.offsetWidth !== lastKbW){ lastKbW = kb.offsetWidth; layoutBlackKeys(); }
    ctx.clearRect(0,0,W,H);

      curT += (targetT - curT) * 0.18;

        if(yb < -10) break;                  // everything after is further above the view
        for(const n of st.notes){

          if(yb - h > H) continue;

          const isNext = (i===idx);

          ctx.arcTo(x+w,top+h,x,top+h,rr); ctx.arcTo(x,top+h,x,top,rr);
          ctx.arcTo(x,top,x+w,top,rr); ctx.closePath();
          if(done){ ctx.fillStyle="rgba(99,207,146,.28)"; }
          else if(isNext){

            if(n.hand){ g.addColorStop(0,"#d9c5f7"); g.addColorStop(1,"#a184d1"); ctx.shadowColor="rgba(178,148,228,.6)"; }
            else { g.addColorStop(0,"#f4c07e"); g.addColorStop(1,"#e0a458"); ctx.shadowColor="rgba(244,192,126,.6)"; }
            ctx.fillStyle=g; ctx.shadowBlur=18;
          } else {
            const g = ctx.createLinearGradient(0,top,0,top+h);
            if(n.hand){ g.addColorStop(0,"#9d7fd0"); g.addColorStop(1,"#4d3a70"); }
            else { g.addColorStop(0,"#6fb6c9"); g.addColorStop(1,"#3a5c66"); }
            ctx.fillStyle=g;
          }
          ctx.fill(); ctx.shadowBlur=0;
          // note label sits at the start edge of the block
          ctx.fillStyle = isNext? (n.hand? "#2e1d4d" : "#4a2f08") : "rgba(240,240,240,.85)";
          ctx.font = "600 12px -apple-system,system-ui,sans-serif";
          ctx.textAlign="center"; ctx.textBaseline="middle";
          ctx.fillText(midiName(n.m), kx.x, yb-12);
          if(n.o && !done){
            // satellite chip on the neighbor key's own lane at the start edge:
            // the mordent's "quick back and forth" shown as geography
            const nk = keyX(n.m + n.o);
            if(nk){
              const cw = Math.max(nk.w*0.45, 12), ch = 10;
              const cx0 = nk.x - cw/2, cy0 = yb - ch - 1;
              ctx.beginPath();
              ctx.moveTo(cx0+3,cy0); ctx.arcTo(cx0+cw,cy0,cx0+cw,cy0+ch,3);
              ctx.arcTo(cx0+cw,cy0+ch,cx0,cy0+ch,3); ctx.arcTo(cx0,cy0+ch,cx0,cy0,3);
              ctx.arcTo(cx0,cy0,cx0+cw,cy0,3); ctx.closePath();
              ctx.fillStyle = n.hand? "rgba(157,127,208,.6)" : "rgba(111,182,201,.6)";
              ctx.fill();
            }

            // vertical stroke through it = lower mordent (as in engraving practice)
            const gx = kx.x, gy = top - 9;
            ctx.strokeStyle = isNext ? "#f4c07e" : (n.hand? "#b89ae2" : "#8fd0e2");
            ctx.lineWidth = 1.6; ctx.lineJoin = "round";
            ctx.beginPath();
            ctx.moveTo(gx-8, gy+3);
            ctx.lineTo(gx-4, gy-3); ctx.lineTo(gx, gy+3);
            ctx.lineTo(gx+4, gy-3); ctx.lineTo(gx+8, gy+3);
            ctx.stroke();
            if(n.o < 0){ ctx.beginPath(); ctx.moveTo(gx, gy-6); ctx.lineTo(gx, gy+6); ctx.stroke(); }
          }
        }
      }
    }
    requestAnimationFrame(draw);
  }

  // ---------- listen / demo playback ----------

      if(i>=steps.length){ stopDemo(); return; }

        const vel = n.hand?0.32:0.5;               // LH a touch softer

  function autoCorrelate(buf, sr){
    const n = buf.length;
    let rms=0; for(let i=0;i<n;i++) rms+=buf[i]*buf[i];
    rms=Math.sqrt(rms/n);
    if(rms<0.002) return -1;                      // too quiet
    // normalized autocorrelation over the piano's practical range (~65 Hz .. 1200 Hz)
    const minLag = Math.floor(sr/1200), maxLag = Math.min(Math.floor(sr/65), n-1);
    const c = new Float32Array(maxLag+1);
    let globalMax = 0;
    for(let lag=minLag; lag<=maxLag; lag++){
      let sum=0, e1=0, e2=0;
      for(let i=0;i<n-lag;i++){ sum+=buf[i]*buf[i+lag]; e1+=buf[i]*buf[i]; e2+=buf[i+lag]*buf[i+lag]; }
      c[lag] = sum/(Math.sqrt(e1*e2)||1);
      if(c[lag]>globalMax) globalMax=c[lag];
    }
    if(globalMax < 0.5) return -1;                // not periodic enough (thump, noise, speech)
    // pick the SHORTEST lag whose peak is nearly as strong as the best —
    // rich piano harmonics make 2x/3x the true period score high too,
    // and picking those reads an octave (or more) too low.
    let T = -1;
    for(let lag=minLag+1; lag<maxLag; lag++){
      if(c[lag] >= 0.9*globalMax && c[lag]>=c[lag-1] && c[lag]>=c[lag+1]){ T = lag; break; }
    }
    if(T<0) return -1;
    // parabolic interpolation around the peak for sub-sample precision
    const a=c[T-1], b=c[T], d=c[T+1], denom = a - 2*b + d;
    const shift = denom ? 0.5*(a-d)/denom : 0;
    return sr/(T+shift);
  }
  let lastDoneStep=null, lastDoneAt=0;
  let micFrame=0, micCandidate=null, micStable=0, lastHitTime=0, lastHeardFlash=0;
  let micStart=0, micMaxRms=0, micWarned=false;
  function micLoop(){
    micRAF=requestAnimationFrame(micLoop);
    if(!micAnalyser) return;
    if(++micFrame % 2) return;                    // analyze every other frame — plenty, and half the CPU
    micAnalyser.getFloatTimeDomainData(micBuf);
    let rms=0; for(let i=0;i<micBuf.length;i++) rms+=micBuf[i]*micBuf[i];
    rms=Math.sqrt(rms/micBuf.length);
    micBarEl.style.width = Math.min(100, Math.round(rms*700)) + "%";
    // watchdog: some in-app browsers grant the mic but deliver pure silence —
    // detect that and say so, instead of appearing to ignore the player
    if(!micStart) micStart = performance.now();

    if(!micWarned && performance.now()-micStart > 4000 && micMaxRms < 0.0005){
      micWarned = true;
      flash("This browser gives me a silent mic — use MIDI or tapping here, or the mic in Safari", 8000);
    }
    const f=autoCorrelate(micBuf, micAC.sampleRate);
    if(f<0) { micHeardEl.textContent="—"; micCandidate=null; micStable=0; return; }
    const m=Math.round(69+12*Math.log2(f/440));
    micHeardEl.textContent = midiName(m);
    // stability: the hammer strike is noisy for the first instant, so require
    // the same note on two consecutive reads before believing it
    if(m===micCandidate) micStable++; else { micCandidate=m; micStable=1; return; }
    if(micStable!==2) return;                     // fire once per stable note, not continuously
    const now=performance.now();
    if(mode!=="learn" || !steps[idx]) return;
    const open = steps[idx].notes.filter(n=>!n.done);
    if(open.some(n => n.m%12 === m%12)){          // octave-forgiving: iPad mics often hear the octave harmonic
      if(now-lastHitTime < 600) return;           // let the previous note's ring fade before re-triggering
      lastHitTime = now;
      press(m, true, true);                       // matching + key lighting happen in press
    } else if(now-lastHeardFlash > 1200){
      lastHeardFlash = now;
      flash("Heard "+midiName(m)+" — the target is "+open.map(n=>midiName(n.m)).join(" + "));
    }
  }

  // ---------- MIDI input (Roland FP-10 etc.) ----------
  // Exact note data from the instrument — no mic guessing. Works where the Web MIDI
  // API exists (desktop Chrome; on iPad via the "Web MIDI Browser" app — Safari lacks it).
  // The piano makes its own sound, so MIDI presses never trigger the synth.
  // MIDI notes go through the same step engine as taps; exact octave required
  // (MIDI data is true), silent (the real piano already sounded). Chords work:
  // each key's note-on arrives separately and fills in its slot of the step.
  function midiNote(note){ press(note, false, true); }

  function midiShowDevices(access){
    const names = [...access.inputs.values()].filter(i=>i.state==="connected").map(i=>i.name);
    const box = el("midiStatus");
    if(names.length){ el("midiDevName").textContent = names.join(", "); box.hidden = false; }
    else box.hidden = true;
  }

  if(navigator.requestMIDIAccess){
    navigator.requestMIDIAccess({sysex:false}).then(access => {
      const bind = () => {
        for(const inp of access.inputs.values()){
          inp.onmidimessage = e => {
            const [st, note, vel] = e.data;
            if((st & 0xf0) === 0x90 && vel > 0){
              // badge doubles as an activity monitor: shows the last note heard,
              // so "is MIDI working?" is answerable at a glance
              el("midiStatus").hidden = false;
              el("midiDevName").textContent = midiName(note);
              midiNote(note);
            }
          };
        }
        midiShowDevices(access);
      };
      access.onstatechange = bind;
      bind();
    }).catch(()=>{ /* permission denied — mic and touch still work */ });
  }

  // debug hook: lets the pitch detector be tested with synthetic tones from the console
  window.__keysDebug = {
    autoCorrelate, midiName, midiNote,
    sampleRate: () => ac().sampleRate,
    state: () => ({stepCount: steps.length, idx, handFilter, step: steps[idx]}),
    jump: n => { idx = Math.min(n, steps.length); if(steps[idx]) curT = steps[idx].t; refresh(); }
  };

  // ---------- Spotify play-along ----------
  // Streams your own Spotify via their embedded player while you practice.
  // Note data never comes from Spotify (it doesn't exist in their API) — this is for playing along by ear.
  const spPanel = el("spotPanel"), spBody = el("spotBody");
  const SP = {
    get cid(){ return localStorage.getItem("sp_cid") || ""; },
    set cid(v){ localStorage.setItem("sp_cid", v); },
    get token(){ return sessionStorage.getItem("sp_token") || ""; },
    redirect(){ return location.origin + location.pathname.replace(/index\.html$/, ""); }
  };
  const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");

  el("spotifyBtn").addEventListener("click", () => { spPanel.hidden = false; spRender(); });
  el("spotClose").addEventListener("click", () => { spPanel.hidden = true; });

  function h(tag, attrs, ...kids){
    const n = document.createElement(tag);
    for(const k in (attrs||{})){ if(k==="onclick") n.addEventListener("click", attrs[k]); else n.setAttribute(k, attrs[k]); }
    kids.forEach(k => n.append(k));
    return n;
  }

  function spEmbed(type, id){
    spBody.replaceChildren(
      h("div",{class:"spot-row",style:"margin-bottom:10px"},
        h("button",{class:"ctl", onclick:spRender},"← Back"),
        h("span",{class:"spot-note"},"Tap play, then switch to Free play and jam along.")),
      h("iframe",{class:"spot-embed", src:"https://open.spotify.com/embed/"+type+"/"+id,
        allow:"autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture", loading:"lazy"})
    );
  }

  function spPasteRow(){
    const inp = h("input",{type:"text", placeholder:"...or paste any Spotify song/playlist link here"});
    const go = () => {
      const m = inp.value.match(/open\.spotify\.com\/(?:intl-[a-z]+\/)?(track|playlist|album|artist|episode)\/([A-Za-z0-9]+)/);
      if(m) spEmbed(m[1], m[2]);
      else spBody.prepend(h("div",{class:"spot-err"},"That doesn't look like a Spotify link — copy one with the Share button in Spotify."));
    };
    return h("div",{class:"spot-row"}, inp, h("button",{class:"ctl", onclick:go},"Open"));
  }

  async function spLogin(){
    const verifier = b64url(crypto.getRandomValues(new Uint8Array(32)).buffer);
    sessionStorage.setItem("sp_verifier", verifier);
    const challenge = b64url(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier)));
    const p = new URLSearchParams({
      client_id: SP.cid, response_type:"code", redirect_uri: SP.redirect(),
      scope:"playlist-read-private playlist-read-collaborative",
      code_challenge_method:"S256", code_challenge: challenge
    });
    location.href = "https://accounts.spotify.com/authorize?" + p;
  }

  async function spHandleRedirect(){
    const code = new URLSearchParams(location.search).get("code");
    if(!code) return;
    history.replaceState(null, "", location.pathname);
    try{
      const r = await fetch("https://accounts.spotify.com/api/token", {
        method:"POST", headers:{"Content-Type":"application/x-www-form-urlencoded"},
        body: new URLSearchParams({
          client_id: SP.cid, grant_type:"authorization_code", code,
          redirect_uri: SP.redirect(), code_verifier: sessionStorage.getItem("sp_verifier")
        })
      });
      const j = await r.json();
      if(j.access_token){ sessionStorage.setItem("sp_token", j.access_token); spPanel.hidden=false; }
    }catch(e){ /* shown as logged-out state */ }
    spRender();
  }

  async function spRender(){
    if(!SP.cid){
      const inp = h("input",{type:"text", placeholder:"Paste your Spotify Client ID"});
      spBody.replaceChildren(
        h("div",{class:"spot-note"},
          h("b",{},"One-time setup (about 2 minutes): "),
          "Spotify asks every app to register — even personal ones. ",
          h("ol",{},
            h("li",{},"Open developer.spotify.com/dashboard and log in with your Spotify account"),
            h("li",{},"Create app — name it Keys, and set the Redirect URI to exactly: "+SP.redirect()),
            h("li",{},"Check “Web API”, save, then copy the Client ID and paste it below"))),
        h("div",{class:"spot-row"}, inp,
          h("button",{class:"ctl", onclick:()=>{ if(inp.value.trim()){ SP.cid = inp.value.trim(); spRender(); } }},"Save")),
        h("div",{class:"spot-note"},"No login yet? You can still paste a Spotify link:"),
        spPasteRow()
      );
      return;
    }
    if(!SP.token){
      spBody.replaceChildren(
        h("div",{class:"spot-row"},
          h("button",{class:"ctl", onclick:spLogin},"Connect my Spotify →"),
          h("button",{class:"ctl", onclick:()=>{ localStorage.removeItem("sp_cid"); spRender(); }},"Change Client ID")),
        h("div",{class:"spot-note"},"Or skip the login and paste a link:"),
        spPasteRow()
      );
      return;
    }
    spBody.replaceChildren(h("div",{class:"spot-note"},"Loading your playlists…"));
    try{
      const r = await fetch("https://api.spotify.com/v1/me/playlists?limit=50",
        {headers:{Authorization:"Bearer "+SP.token}});
      if(r.status===401){ sessionStorage.removeItem("sp_token"); spRender(); return; }
      const j = await r.json();
      const cards = (j.items||[]).map(pl =>
        h("button",{class:"spot-card", onclick:()=>spEmbed("playlist", pl.id)},
          h("span",{class:"n"}, pl.name),
          h("span",{class:"c"}, (pl.tracks?.total ?? "?")+" songs")));
      spBody.replaceChildren(
        spPasteRow(),
        h("div",{class:"spot-note",style:"margin:6px 0 2px"},"Your playlists — tap one to play:"),
        cards.length ? h("div",{class:"spot-grid"}, ...cards)
                     : h("div",{class:"spot-note"},"No playlists found on this account.")
      );
    }catch(e){
      spBody.replaceChildren(h("div",{class:"spot-err"},"Couldn't reach Spotify — check the connection and try again."),
        h("div",{class:"spot-row"}, h("button",{class:"ctl", onclick:spRender},"Retry")));
    }
  }
  spHandleRedirect();

  // init
  steps = buildSteps(song);
  buildKeyboard(...windowForSong(song));
  refresh();
})();
</script>
